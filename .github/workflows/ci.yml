name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      VECTOR_STORE_BACKEND: memory
      RERANK_ENABLED: "false"
      REDIS_URL: "redis://127.0.0.1:1/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install uv==0.12.19
          uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build workbench
        working-directory: frontend
        run: npm ci && npm run build
      - name: Lint
        # 历史冻结实验脚本保留原样，检查应用、测试与当前评测入口。
        run: uv run ruff check app scripts tests integration eval/investigation_eval.py
      - name: Run tests
        run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: integration-only-password
      DATABASE_URL: postgresql+psycopg://opspilot:integration-only-password@127.0.0.1:15432/opspilot
      VECTOR_STORE_BACKEND: milvus
      MILVUS_URI: http://127.0.0.1:19531
      REDIS_URL: redis://127.0.0.1:16379/0
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      MODEL_STRICT: 'false'
      AGENT_MODE: rule
      AUTH_RATE_LIMIT_PER_MINUTE: '1000'
      REGISTRATION_ENABLED: 'true'
      JWT_SECRET: integration-only-random-value-for-jwt-at-least32
      OPSPILOT_E2E_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project
        run: |
          pip install uv==0.12.19
          uv sync --frozen
          cd frontend && npm ci && npm run build
      - name: Start isolated infrastructure
        run: docker compose -p opspilot-ci -f compose.local.yml up -d --wait --wait-timeout 180 postgres redis milvus
      - name: Verify real infrastructure
        run: |
          uv run python -m integration.check_stack
          uv run python -m integration.check_milvus --uri "$MILVUS_URI" --collection opspilot_test_ci_migration
      - name: Start isolated browser-test application
        run: |
          uv run python -m scripts.seed
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/opspilot-api.log 2>&1 &
          uv run python -m integration.wait_ready
      - name: Browser journeys
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stop isolated infrastructure
        if: always()
        run: docker compose -p opspilot-ci -f compose.local.yml down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
