name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      QDRANT_MODE: memory
      RERANK_ENABLED: "false"
      REDIS_URL: "redis://127.0.0.1:1/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install uv==0.12.19
          uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build workbench
        working-directory: frontend
        run: npm ci && npm run build
      - name: Lint
        # 历史冻结实验脚本保留原样，检查应用、测试与当前评测入口。
        run: uv run ruff check app scripts tests eval/investigation_eval.py
      - name: Run tests
        run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opspilot_integration
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: integration-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_integration"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ['6333:6333']
    env:
      DATABASE_URL: postgresql+psycopg://opspilot:integration-only-password@127.0.0.1:5432/opspilot_integration
      QDRANT_MODE: remote
      QDRANT_URL: http://127.0.0.1:6333
      REDIS_URL: redis://127.0.0.1:6379/0
      EMBEDDING_PROVIDER: mock
      LLM_PROVIDER: mock
      MODEL_STRICT: 'false'
      AGENT_MODE: rule
      AUTH_RATE_LIMIT_PER_MINUTE: '1000'
      REGISTRATION_ENABLED: 'true'
      JWT_SECRET: integration-only-random-value-for-jwt-at-least32
      OPSPILOT_E2E_ISOLATED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project
        run: |
          pip install uv==0.12.19
          uv sync --frozen
          cd frontend && npm ci && npm run build
      - name: Verify real infrastructure
        run: uv run python -m integration.check_stack
      - name: Start isolated browser-test application
        run: |
          uv run python -m scripts.seed
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/opspilot-api.log 2>&1 &
          uv run python -m integration.wait_ready
      - name: Browser journeys
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
