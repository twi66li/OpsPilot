# 由宿主机Nginx提供公网入口，API与数据服务继续使用Docker内网。
limit_req_zone $binary_remote_addr zone=opspilot_api:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    # 原PDF与可选解析文件各最多10MiB，额外预留multipart开销。
    client_max_body_size 25m;
    access_log /var/log/nginx/opspilot_access.log;
    error_log /var/log/nginx/opspilot_error.log;

    location /api/ {
        limit_req zone=opspilot_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
