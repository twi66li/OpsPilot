  expected_keywords: []
  reference_answer: 先定位上游实例并检查存活和发布状态。readiness 控制是否接收 Service 流量，失败本身不意味着重启；liveness 达到连续失败阈值才触发重启，不能混为一种机制。
  answer_points:
  - 检查上游存活与发布状态
  - readiness 控制流量
  - liveness 连续失败达到阈值重启
  evidence:
  - doc_id: ops-kb-011
    quote: '1. 定位报错路由对应的上游服务与实例。

      2. 查看该服务实例的存活与发布状态。'
  - doc_id: ops-kb-013
    quote: readiness 失败会使 Pod 未就绪，停止接受对应 Service 的流量，不代表容器一定被重启。liveness 连续失败达到阈值会触发重启。配置 startup 探针时，启动探针成功前不会执行其他探针；它适合慢启动应用。排查时先看
