- id: ops-q-001-4
  question: 演示环境同时出现 ERR_5003 和大量慢 SQL，该怎样结合连接池与 SQL 排查，是否能直接批量清理 Sleep 连接？
  category: multi_document
  task_type: retrieval
  tenant_id: default
  expected_doc_ids:
  - ops-kb-001
  - ops-kb-003
  expected_docs:
  - ERR_5003 数据库连接池耗尽处理手册
  - MySQL 慢查询治理
  expected_keywords: []
  reference_answer: 先核对连接池参数、慢查询占用和连接泄漏，再聚合慢 SQL 并用 EXPLAIN 看执行计划；不能批量清理所有 Sleep 连接，处置需确认业务影响与授权。
  answer_points:
  - 核对连接池、慢查询与泄漏
  - 聚合慢 SQL 并用 EXPLAIN
  - 禁止无差别批量 KILL
  evidence:
  - doc_id: ops-kb-001
    quote: '1. 确认连接池配置：`maxPoolSize`、`idleTimeout`、`maxWait` 是否与 DB 的 `max_connections` 匹配。

      2. 检查是否存在慢查询占用连接：`SELECT * FROM information_schema.processlist WHERE time > 5;`

      3. 检查是否有连接泄漏：连接未在 finally 中归还、事务未提交/回滚。

      4. 检查是否发生流量突增或下游抖动导致的线程堆积。


      ## 处理方案

      - 应急：先确认连接归属、事务与业务影响，经值班负责人批准后才可处置选定连接；不能批量 KILL 所有 Sleep 连接。

      - 扩容：将 `max_connections` 上调 20%~50%，同时调大应用连接池 `maxPoolSize`。

      - 治理：为慢 SQL 建立索引或加缓存；连接池开启 `leakDetectionThreshold`。'
  - doc_id: ops-kb-003
    quote: '1. `pt-query-digest` 或云监控聚合 top 慢 SQL。

      2. `EXPLAIN` 检查执行计划：全表扫描、文件排序、索引失效。

      3. 检查锁等待：`information_schema.innodb_trx`、`data_locks`。'
  should_abstain: false
  group_id: ops-q-001-4-multidoc
  provenance:
    generation_model: qwen3.8-flash
    label_origin: model_generated_from_evidence
    human_reviewed: false
    review_model: deepseek-v4-flash-0731
    review_status: model_reviewed_and_codex_adjudicated
  split: test
