[project]
name = "opspilot"
version = "1.0.0"
description = "运维证据调查与审批工作台"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "SQLAlchemy[asyncio]==2.1.6",
  "PyMySQL==1.2.3",
  "cryptography==50.0.2",
  "PyJWT==2.15.1",
  "redis==8.1.0",
  "rank-bm25==0.2.2",
  "jieba==0.42.1",
  "openai==2.54.0",
  "langgraph==1.2.18",
  "langchain-core==1.7.1",
  "qdrant-client==1.13.3",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "prometheus-client==0.26.0",
  "langgraph-checkpoint-sqlite==3.1.2",
  "psycopg[binary]==3.3.8",
  "langgraph-checkpoint-postgres==3.2.0",
  "mcp==2.3.0",
  "python-multipart==0.0.33",
  "pypdf==7.0.1",
  "asyncpg==0.32.0",
  "aiosqlite==0.22.1",
  "aiomysql==0.3.2",
  "structlog==26.1.0",
  "alembic>=1.20.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
